<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200" role="img">
<defs>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#110d26"/><stop offset="1" stop-color="#07060f"/></linearGradient>
<linearGradient id="rain" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="840" y2="0" spreadMethod="repeat"><stop offset="0.000" stop-color="#00f0ff"/><stop offset="0.167" stop-color="#9d6bff"/><stop offset="0.333" stop-color="#ff2bd6"/><stop offset="0.500" stop-color="#ff8a3c"/><stop offset="0.667" stop-color="#ffe14d"/><stop offset="0.833" stop-color="#b6ff3c"/><stop offset="1.000" stop-color="#00f0ff"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="840 0" dur="7s" repeatCount="indefinite"/></linearGradient>
</defs>
<style>
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.flick{animation:flick 6s linear infinite}
@keyframes flick{0%,40%,44%,48%,100%{opacity:1}42%{opacity:.25}46%{opacity:.55}}
.in{opacity:0;animation:in .7s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.run{animation:run linear infinite}
@keyframes run{from{stroke-dashoffset:16}to{stroke-dashoffset:-320}}
.orbit{animation:orbit 3.2s linear infinite}
@keyframes orbit{to{stroke-dashoffset:0}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1!important}}
</style>
<rect x="1.5" y="1.5" width="837" height="197" rx="18" fill="url(#bg)" stroke="url(#rain)" stroke-width="1.5"/>

<circle cx="30" cy="27" r="6" fill="#ff2bd6"/><circle cx="50" cy="27" r="6" fill="#ffe14d"/><circle cx="70" cy="27" r="6" fill="#b6ff3c"/>
<text x="420" y="31" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" letter-spacing="2" fill="#8f8ab8">~/eduardo/ahora</text>
<line x1="2" y1="48" x2="838" y2="48" stroke="#9d6bff" stroke-opacity=".35"/>
<g class="in" style="animation-delay:0.3s"><text x="30" y="84" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" fill="#e9e6ff" xml:space="preserve"><tspan fill="#00f0ff" font-weight="700">&gt; </tspan>Estudio la carrera y construyo proyectos de <tspan fill="#00f0ff" font-weight="700">NLP</tspan> y <tspan fill="#00f0ff" font-weight="700">ML aplicado</tspan>.</text></g>
<g class="in" style="animation-delay:1s"><text x="30" y="116" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" fill="#e9e6ff" xml:space="preserve"><tspan fill="#ff2bd6" font-weight="700">&gt; </tspan>Practico <tspan fill="#ff2bd6" font-weight="700">deep learning</tspan> con PyTorch: redes desde cero y transfer learning.</text></g>
<g class="in" style="animation-delay:1.7s"><text x="30" y="148" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" fill="#e9e6ff" xml:space="preserve"><tspan fill="#b6ff3c" font-weight="700">&gt; </tspan>Integro modelos de lenguaje en aplicaciones web <tspan fill="#b6ff3c" font-weight="700">full-stack</tspan>.</text></g>
<rect x="30" y="166" width="9" height="17" fill="#ffe14d" class="blink"/>

</svg>
